[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
script = 'script'
solc_version = '0.8.30'
evm_version = "cancun"

remappings = [
    '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
    'forge-std/=lib/forge-std/src/',
    '@uniswap/v4-core/=lib/uniswap-hooks/lib/v4-core/',
    'v4-core/=lib/uniswap-hooks/lib/v4-core/',
    'v4-periphery/=lib/v4-periphery/',
    'uniswap-hooks/=lib/uniswap-hooks/'
]

# Only compile our own contracts and tests — ignore everything in lib/
fs_permissions = []

[fmt]
line_length = 120
tab_width = 4

[profile.arc]
eth_rpc_url = "https://rpc.testnet.arc.network"
chain_id = 5042002

[rpc_endpoints]
arc = "https://rpc.testnet.arc.network"