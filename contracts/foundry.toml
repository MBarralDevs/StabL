[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc_version = '0.8.30'
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

# Arc Testnet as a named network — use with: forge create --network arc
[network.arc]
rpc_url = "https://rpc.testnet.arc.network"
chain_id = 5042002

[fmt]
line_length = 120
tab_width = 4