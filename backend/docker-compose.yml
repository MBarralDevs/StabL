# backend/docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: stabl-postgres
    environment:
      POSTGRES_USER: stabl
      POSTGRES_PASSWORD: stabl_dev_password
      POSTGRES_DB: stabl_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stabl-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: